overfitting_mitigation:
  seed: 7
  weight_decay: 0.001
  dropout: 0.1
  label_smoothing: 0.0 # Previously 0.1 (for the best one - 200 epochs)
  randaugment: true
  randaugment_num_ops: 2
  randaugment_magnitude: 9 # Next try changing only this to 7
  random_erasing: 0.25
  mixup: 0.0 # Previously tried 0.2 (for the best one - 200 epochs)
  cutmix: 0.0
  averaging: ema+swa
  averaging_start_epoch: 20
  averaging_frequency: 1
  ema_decay: 0.999
  swa_bn_update: true
  early_stopping_patience: 150
  early_stopping_monitor: val_loss
  gradient_clip_val: 1.0
  max_epochs: 700 # Previously did 200 epochs for best one
