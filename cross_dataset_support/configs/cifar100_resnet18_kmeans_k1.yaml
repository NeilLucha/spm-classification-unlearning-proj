model:
  target: models.spm_classifier_kmeans.SemiParametricClassifier_KMeans
  params:
    encoder_type: resnet18
    embed_dim: 512
    num_classes: 100
    K: 1
    learning_rate: 0.1
    pretrained_imagenet: false
    pretrained_cifar: false
data:
  target: dataset.cifar100_datamodule.CIFAR100DataModule
  params:
    batch_size: 64
    model_type: classifier
    num_classes: 100
    support_size_train: 1000
    support_size_eval: 5000
    query_digits: null
    support_digits: null
lightning:
  callbacks:
    checkpoint_callback:
      target: pytorch_lightning.callbacks.ModelCheckpoint
      params:
        monitor: val_acc
        mode: max
        save_top_k: 1
        save_last: true
        filename: "best-{epoch:02d}-{val_acc:.2f}"
        dirpath: "./results/classification/cifar100_resnet18_kmeans_k1"
  trainer:
    max_epochs: 100
    devices: 1
    check_val_every_n_epoch: 10
    log_every_n_steps: 20
    accelerator: "gpu"
