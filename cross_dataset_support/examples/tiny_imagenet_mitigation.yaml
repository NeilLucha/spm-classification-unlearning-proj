overfitting_mitigation:
  seed: 7
  weight_decay: 0.001
  dropout: 0.1
  label_smoothing: 0.1
  randaugment: true
  randaugment_num_ops: 2
  randaugment_magnitude: 7
  random_erasing: 0.15
  mixup: 0.1
  cutmix: 0.0
  averaging: ema
  averaging_start_epoch: 20
  averaging_frequency: 1
  ema_decay: 0.999
  swa_bn_update: true
  early_stopping_patience: 20
  early_stopping_monitor: val_loss
  gradient_clip_val: 1.0
  max_epochs: 100
